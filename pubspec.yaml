name: mencia
description: Offline periodic facial emotion recognition app optimized for Xiaomi Mi A2 (Snapdragon 660).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

